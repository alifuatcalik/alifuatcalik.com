<!doctype html>
<!-- PNG ikonlar (apple-touch-icon, favicon.ico içi) bu dosyadan üretilir: docs/og/render-icons.sh
     ?s=<px> kare boyutu, &bare şeffaf zemin -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  .box { position: fixed; top: 0; left: 0; display: grid; place-items: center; background: #09090b; }
  .box i { background: #b899ff; transform: rotate(45deg); }
  .bare { background: transparent; }
  .bare i { background: #7333cc; }
</style></head>
<body><div class="box"><i></i></div><script>
  const q = new URLSearchParams(location.search);
  const s = Number(q.get('s') || 180), bare = q.has('bare');
  const box = document.querySelector('.box'), i = box.querySelector('i');
  const k = bare ? 0.58 : 0.5;
  Object.assign(box.style, { width: s + 'px', height: s + 'px' });
  Object.assign(i.style, { width: s * k + 'px', height: s * k + 'px', borderRadius: s * k * 0.22 + 'px' });
  if (bare) box.classList.add('bare');
</script></body></html>
