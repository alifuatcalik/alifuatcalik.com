<div class="wrap">
  <div class="contact">
    <div>
      <h2 class="sec-head__title contact__title">{{ c().contact.title }}</h2>
      <p class="contact__body">{{ c().contact.body }}</p>
    </div>
    <ul class="contact__links">
      @for (link of c().contact.links; track link.href) {
        <li>
          <a
            class="contact__link"
            [href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener' : null"
          >
            <span>{{ link.label }}</span>
            <span class="contact__value">{{ link.display }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</div>
