<div class="wrap">
  <div class="sec-head">
    <h2 class="sec-head__title">{{ head.title[lang()] }}</h2>
  </div>

  <div class="skills">
    @for (skill of skills; track skill.title.en) {
      <div class="skill">
        <h3 class="skill__title">{{ skill.title[lang()] }}</h3>
        <p class="skill__body">{{ skill.body[lang()] }}</p>
      </div>
    }
  </div>
</div>
