<div class="wrap">
  <div class="sec-head">
    <h2 class="sec-head__title">{{ c().skills.title }}</h2>
  </div>

  <div class="skills">
    @for (skill of c().skills.items; track $index) {
      <div class="skill">
        <h3 class="skill__title">{{ skill.title }}</h3>
        <p class="skill__body">{{ skill.body }}</p>
      </div>
    }
  </div>
</div>
