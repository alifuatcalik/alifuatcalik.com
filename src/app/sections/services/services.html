<div class="wrap">
  <div class="sec-head">
    <h2 class="sec-head__title">{{ c().services.title }}</h2>
    <p class="sec-head__note">{{ c().services.note }}</p>
  </div>

  <div class="services">
    @for (service of c().services.items; track $index; let i = $index) {
      <div class="svc">
        <span class="svc__n" aria-hidden="true">{{ i + 1 | number: '2.0-0' }}</span>
        <h3 class="svc__title">{{ service.title }}</h3>
        <p class="svc__body">{{ service.body }}</p>
      </div>
    }
  </div>
</div>
